  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      const div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.background = 'red';
      div.style.color = 'white';
      div.style.padding = '20px';
      div.style.zIndex = '999999';
      div.style.fontFamily = 'monospace';
      div.style.fontSize = '14px';
      div.style.whiteSpace = 'pre-wrap';
      div.innerText = 'JS Error: ' + message + '\nSource: ' + source + '\nLine: ' + lineno + ':' + colno + '\nStack: ' + (error ? error.stack : 'N/A');
      document.body.appendChild(div);
      return false;
    };
    window.onunhandledrejection = function (event) {
      const div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.background = 'orange';
      div.style.color = 'black';
      div.style.padding = '20px';
      div.style.zIndex = '999999';
      div.style.fontFamily = 'monospace';
      div.style.fontSize = '14px';
      div.style.whiteSpace = 'pre-wrap';
      div.innerText = 'Unhandled Promise Rejection: ' + event.reason + '\nStack: ' + (event.reason ? event.reason.stack : 'N/A');
      document.body.appendChild(div);
    };
  </script>

  <script>
    (function () {
      const sectionSeoMap = {
        'home': {
          title: 'Meta Ads & Performance Marketing Specialist | Al-Amin Khan',
          description: 'I am Al-Amin Khan, a Performance Marketing Specialist offering high-converting Meta Ads, Server-Side Tracking, and WordPress solutions for global brands.'

        },
        'services': {
          title: 'Meta Ads & WordPress Development Services | Al-Amin Khan',
          description: 'Explore my premium digital marketing services, including Meta Ads management, CAPI tracking, sales funnels, and WordPress website development.'
        },
        'contact': {
          title: 'Contact Al-Amin Khan | Hire a Remote Marketing Expert',
          description: 'Ready to scale your business? Contact Al-Amin Khan for expert Meta Ads management, advanced data tracking, and WordPress solutions today.'
        },
        'pricing': {
          title: 'Website & Marketing Packages | Al-Amin Khan',
          description: 'Transparent pricing for WordPress websites, Meta Ads management, and Server-Side tracking solutions.'
        },
        'meta-ads': {
          title: 'Meta Ads Case Studies & Proven Results | Al-Amin Khan',
          description: 'Real client case studies and performance metrics from live Facebook & Instagram ad campaigns.'
        },
        'blog': {
          title: 'Digital Marketing & Tracking Insights | Al-Amin Khan',
          description: 'In-depth industry case studies on Meta CAPI, Google Analytics 4, and server-side conversion tracking.'
        }
      };

      function updateSectionSeo(sectionId) {
        const cleanId = (sectionId || '').replace(/^#/, '').toLowerCase();
        const data = sectionSeoMap[cleanId] || sectionSeoMap['home'];
        document.title = data.title;
        const descEl = document.querySelector('meta[name="description"]');
        if (descEl) descEl.setAttribute('content', data.description);
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute('content', data.title);
        const ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogDesc) ogDesc.setAttribute('content', data.description);
      }

      window.updateSectionSeo = updateSectionSeo;

      window.addEventListener('hashchange', function () {
        const hash = window.location.hash.replace('#', '');
        if (hash) updateSectionSeo(hash);
      });

      document.addEventListener('DOMContentLoaded', function () {
        const hash = window.location.hash.replace('#', '');
        if (hash) updateSectionSeo(hash);

        if ('IntersectionObserver' in window) {
          const sectionObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting && entry.intersectionRatio >= 0.3) {
                const id = entry.target.id;
                if (id && sectionSeoMap[id]) {
                  updateSectionSeo(id);
                }
              }
            });
          }, { threshold: [0.3] });

          setTimeout(() => {
            document.querySelectorAll('section[id]').forEach(sec => {
              sectionObserver.observe(sec);
            });
          }, 600);
        }
      });
    })();
  </script>

    /* ====================================================
         CUSTOM ANIMATION SUITE & INTERACTIVE CONTROLS
         ==================================================== */
    html {
      scroll-behavior: smooth;
    }

    /* Ambient floating & breathing background lights */
    @keyframes ambientGlowFloat {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(0.95);
        opacity: 0.14;
      }

      50% {
        transform: translate(-48%, -52%) scale(1.12);
        opacity: 0.24;
      }
    }

    .animate-ambient-glow {
      animation: ambientGlowFloat 8s ease-in-out infinite;
    }

    /* Scroll Reveal Animations */
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .reveal-on-scroll.is-revealed {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    /* Interactive Hover Lift & Glow for Cards */
    .card-hover-interactive {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease !important;
    }

    .card-hover-interactive:hover {
      transform: translateY(-8px) scale(1.01) !important;
      box-shadow: 0 20px 40px -15px rgba(61, 180, 189, 0.28) !important;
      border-color: rgba(61, 180, 189, 0.5) !important;
    }

    /* Currency Switch Button Container (Prominent Capsule Switch) */
    .currency-switch-wrapper {
      display: inline-flex;
      align-items: center;
      background: #121824;
      border: 2px solid rgba(61, 180, 189, 0.6);
      border-radius: 9999px;
      padding: 4px;
      position: relative;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(61, 180, 189, 0.25);
      user-select: none;
      cursor: pointer;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .currency-switch-wrapper:hover {
      border-color: rgba(61, 180, 189, 0.9);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), 0 0 25px rgba(61, 180, 189, 0.35);
    }

    .currency-switch-slider {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      background: linear-gradient(135deg, #3db4bd 0%, #00c6ff 100%);
      border-radius: 9999px;
      box-shadow: 0 4px 16px rgba(61, 180, 189, 0.45);
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 1;
    }

    .currency-switch-btn {
      position: relative;
      z-index: 2;
      padding: 8px 24px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 9999px;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color 0.25s ease;
    }

    body.light-mode .currency-switch-wrapper {
      background: #ffffff !important;
      border-color: rgba(61, 180, 189, 0.6) !important;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08) !important;
    }


    /* Floating Hero Portrait Animation */
    @keyframes heroFloat {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-12px) rotate(0.6deg);
      }
    }

    .animate-hero-float {
      animation: heroFloat 5.5s ease-in-out infinite;
    }

    /* Infinite Horizontal Marquee Ticker */
    @keyframes marqueeScroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marqueeScroll 28s linear infinite;
    }

    .marquee-track:hover {
      animation-play-state: paused;
    }

    /* Hero Typewriter Blinking Cursor (Auto-hides when typing completes) */
    @keyframes blinkCursor {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    .typewriter-cursor {
      display: inline-block;
      color: var(--color-accent, #3db4bd);
      font-weight: 300;
      animation: blinkCursor 0.8s infinite;
      margin-left: 2px;
    }

    .typewriter-cursor.is-hidden {
      display: none !important;
    }

    /* Animated Skill Bars (Core Competencies) */
    .skill-item-row {
      margin-bottom: 16px !important;
    }

    .skill-bar-track {
      width: 100% !important;
      height: 8px !important;
      background: rgba(255, 255, 255, 0.08) !important;
      border-radius: 9999px !important;
      overflow: hidden !important;
      position: relative !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    .skill-bar-fill {
      height: 100% !important;
      width: 0%;
      background: linear-gradient(90deg, #3db4bd 0%, #00c6ff 50%, #3db4bd 100%) !important;
      border-radius: 9999px !important;
      position: relative !important;
      transition: width 1.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
      box-shadow: 0 0 12px rgba(61, 180, 189, 0.6) !important;
    }

    .skill-bar-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #ffffff;
      border-radius: 9999px;
      box-shadow: 0 0 8px #00c6ff;
    }

    body.light-mode .skill-bar-track {
      background: #e2e8f0 !important;
      border-color: #cbd5e1 !important;
    }

    /* Rotating Circles behind Hero Picture */
    @keyframes spinCircleClockwise {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spinCircleCounter {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }

    .hero-rotating-circle-outer {
      position: absolute !important;
      width: 450px !important;
      height: 450px !important;
      top: 50% !important;
      left: 50% !important;
      margin-top: -225px !important;
      margin-left: -225px !important;
      border-radius: 50% !important;
      pointer-events: none !important;
      user-select: none !important;
      z-index: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      animation: spinCircleClockwise 22s linear infinite !important;
    }

    .hero-rotating-circle-inner {
      position: absolute !important;

      height: 385px !important;
      top: 50% !important;
      left: 50% !important;
      margin-top: -192.5px !important;
      margin-left: -192.5px !important;
      border-radius: 50% !important;
      border: 1.5px dashed rgba(61, 180, 189, 0.45) !important;

    }

    }

    /* Shimmer sweep effect */
    @keyframes shimmerSweep {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(200%);
      }
    }

    .animate-shimmer {
      position: relative;
      overflow: hidden;
    }

    .animate-shimmer::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      transform: translateX(-100%);
      animation: shimmerSweep 3s infinite;
    }

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // SPA Hash Scroll Support
      let lastScrolledHash = "";
      function checkHashScroll() {
        if (window.location.pathname === "/") {
          const hash = window.location.hash;
          if (hash && hash.length > 1) {
            if (hash !== lastScrolledHash) {
              try {
                const target = document.querySelector(hash);
                if (target) {
                  lastScrolledHash = hash;
                  setTimeout(function () {
                    const header = document.getElementById('main-header');
                    const hOffset = header ? header.offsetHeight : 80;
                    const targetY = target.getBoundingClientRect().top + window.pageYOffset - hOffset;
                    window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
                  }, 300);
                }
              } catch (err) { }
            }
          } else {
            lastScrolledHash = "";
          }
        } else {
          lastScrolledHash = "";
        }
      }
      window.addEventListener("hashchange", checkHashScroll);
      window.addEventListener("popstate", checkHashScroll);

      function initCounters() {
        console.log("initCounters: Starting check...");
        const numElements = Array.from(document.querySelectorAll('.font-bold'));
        console.log("initCounters: Found .font-bold elements:", numElements.length);
        if (numElements.length === 0) return;

        const stats = [
          {
            labelText: "Experience",
            el: numElements.find(function (el) {
              const match = el.textContent.includes('8+') && el.textContent.includes('Yrs');
              console.log("Checking element for Experience:", el.textContent, "Match:", match);
              return match;
            }),
            target: 8,
            suffix: "+ ",
            spanText: "Yrs"
          },
          {
            labelText: "Clients Met",
            el: numElements.find(function (el) {
              const match = el.textContent.includes('1K') || el.textContent.includes('1000');
              console.log("Checking element for Clients:", el.textContent, "Match:", match);
              return match;
            }),
            target: 1000,
            suffix: "+",
            formatK: true
          },
          {
            labelText: "Success Rate",
            el: numElements.find(function (el) {
              const match = el.textContent.includes('97') && el.textContent.includes('%');
              console.log("Checking element for Success Rate:", el.textContent, "Match:", match);
              return match;
            }),
            target: 97,
            suffix: "%"
          }
        ];

        stats.forEach(function (stat) {
          const numEl = stat.el;
          if (!numEl) {
            console.log("initCounters: Could not find element for:", stat.labelText);
            return;
          }
          if (numEl.hasAttribute('data-counter-initialized')) {
            console.log("initCounters: Element already initialized for:", stat.labelText);
            return;
          }
          console.log("initCounters: Initializing element for:", stat.labelText);
          numEl.setAttribute('data-counter-initialized', 'true');

          // Set initial state to 0 to avoid flashing the final value
          if (stat.spanText) {
            numEl.innerHTML = '0' + stat.suffix + '<span class="text-accent text-lg">' + stat.spanText + '</span>';
          } else {
            numEl.textContent = '0' + stat.suffix;
          }

          if (typeof IntersectionObserver !== 'undefined') {
            console.log("initCounters: IntersectionObserver is supported, setting up observer for:", stat.labelText);
            const observer = new IntersectionObserver(function (entries) {
              entries.forEach(function (entry) {
                console.log("Observer callback for:", stat.labelText, "isIntersecting:", entry.isIntersecting);
                if (entry.isIntersecting) {
                  animateNumber(numEl, stat);
                  observer.unobserve(numEl);
                }
              });
            }, { threshold: 0 });
            observer.observe(numEl);
          } else {
            console.log("initCounters: IntersectionObserver NOT supported, animating directly for:", stat.labelText);
            animateNumber(numEl, stat);
          }
        });
      }

      function animateNumber(element, stat) {
        console.log("animateNumber: Starting animation for:", stat.labelText);
        const end = stat.target;
        const duration = 2000; // 2 seconds animation duration
        const startTime = performance.now();

        function update(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeProgress = progress * (2 - progress); // Ease Out Quad
          const currentValue = Math.floor(easeProgress * end);

          let displayValue = currentValue;
          if (stat.formatK && currentValue >= 1000) {
            displayValue = "1K";
          }

          if (stat.spanText) {
            element.innerHTML = displayValue + stat.suffix + '<span class="text-accent text-lg">' + stat.spanText + '</span>';
          } else {
            element.textContent = displayValue + stat.suffix;
          }

          if (progress < 1) {
            requestAnimationFrame(update);
          } else {
            console.log("animateNumber: Finished animation for:", stat.labelText);
            if (stat.spanText) {
              element.innerHTML = end + stat.suffix + '<span class="text-accent text-lg">' + stat.spanText + '</span>';
            } else {
              element.textContent = stat.formatK ? '1K+' : end + stat.suffix;
            }
          }
        }

        requestAnimationFrame(update);
      }

      const observer = new MutationObserver(function () {
        console.log("MutationObserver: DOM changed, checking hash and counters...");
        checkHashScroll();
        initCounters();
        const allLinks = document.querySelectorAll('a');
        allLinks.forEach(function (link) {
          if (!link.hasAttribute('data-scroll-fixed')) {
            link.setAttribute('data-scroll-fixed', 'true');
            const href = link.getAttribute("href");
            if (href === "/" || href === "/#home" || href === "#home" || link.className.includes("logo") || (link.textContent && link.textContent.toLowerCase().includes("logo"))) {
              link.addEventListener("click", function (e) {
                if (window.location.pathname === "/") {
                  e.preventDefault();
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                  // Clear URL hash when navigating back to home/top
                  if (history.pushState) {
                    history.pushState("", document.title, window.location.pathname + window.location.search);
                  } else {
                    window.location.hash = "";
                  }
                  lastScrolledHash = "";
                }
              });
            }
          }
        });

        // Meta Ads and Navbar are managed natively by SPA
      });

      // Run counters immediately on load and start observing future changes
      initCounters();
      observer.observe(document.body, { childList: true, subtree: true });
    });

    /* ===================================================
         1. CYBER NET / GRID BACKGROUND PATTERNS
         =================================================== */
    .cyber-grid-pattern {
      background-image:
        linear-gradient(to right, rgba(61, 180, 189, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(61, 180, 189, 0.07) 1px, transparent 1px);

      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 60%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 60%, transparent 100%);
      pointer-events: none;
    }

    .perspective-grid-net {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 140px;
      background-image:
        linear-gradient(to right, rgba(61, 180, 189, 0.09) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(61, 180, 189, 0.09) 1px, transparent 1px);
      background-size: 32px 32px;
      transform: perspective(350px) rotateX(55deg);
      transform-origin: top center;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent);
      pointer-events: none;
      z-index: 1;
    }

      background-image:

    /* ===================================================
         2. SCROLLSPY NAVIGATION INDICATOR (Active Underline)
         =================================================== */
    .nav-item-link {
      position: relative;
      transition: color 0.25s ease;
    }

    .nav-item-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      width: 0%;
      height: 2.5px;
      background: #3db4bd;
      border-radius: 9999px;
      transform: translateX(-50%);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      opacity: 0;
      box-shadow: 0 0 10px rgba(61, 180, 189, 0.8);
    }

    .nav-item-link:hover::after,
    .nav-item-link.active::after {
      width: 100%;
      opacity: 1;
    }

    .nav-item-link.active {
      color: #3db4bd !important;
      font-weight: 700 !important;
    }

    body.light-mode .nav-item-link.active {
      color: #0891b2 !important;

    body.light-mode .nav-item-link::after {
      background: #0891b2 !important;
      box-shadow: 0 0 8px rgba(8, 145, 178, 0.6) !important;

  <!-- Firebase Integration module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { initializeFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config matching existing index-wTLK3pDc.js definitions
    const firebaseConfig = {
      apiKey: "AIzaSyAAiTa9069Nu8Jhj3oK2fzfA15-zKnVUpc",
      authDomain: "gen-lang-client-0431762799.firebaseapp.com",
      projectId: "gen-lang-client-0431762799",
      storageBucket: "gen-lang-client-0431762799.firebasestorage.app",
      messagingSenderId: "348561710489",
      appId: "1:348561710489:web:f7cd9994a947a9d025c708"
    };

    let app = null;
    let db = null;

    try {
      app = initializeApp(firebaseConfig);
      db = initializeFirestore(app, {
        databaseId: "ai-studio-84d8405f-714a-4fd2-a8aa-287773ce0a4b"
      });
    } catch (err) {
      console.error("Firebase or Firestore failed to initialize:", err);
    }

    // ----------------------------------------------------
    // 1. Local Storage Interceptor (Sync Contact Form Submissions)
    // ----------------------------------------------------
    let isSyncingSubmissions = false;
    const originalSetItem = window.localStorage.setItem;

    window.localStorage.setItem = function (key, value) {
      originalSetItem.apply(this, arguments);

      if (key === 'db_contactSubmissions' && !isSyncingSubmissions) {
        try {
          const list = JSON.parse(value) || [];
          syncSubmissionsToFirestore(list);
        } catch (e) {
          console.error("Local interceptor parse error:", e);
        }
      }
    };

    async function syncSubmissionsToFirestore(localList) {
      if (!db) return;
      try {
        isSyncingSubmissions = true;
        const querySnapshot = await getDocs(collection(db, "contactSubmissions"));
        const firestoreIds = [];
        querySnapshot.forEach(doc => {
          firestoreIds.push(doc.id);
        });

        // 1. Add missing documents to Firestore
        for (const item of localList) {
          if (item && item.id) {
            if (!firestoreIds.includes(item.id)) {
              await setDoc(doc(db, "contactSubmissions", item.id), {
                name: item.name || "Anonymous",
                email: item.email || "",
                subject: item.subject || "",
                message: item.message || "",
                createdAt: item.createdAt || new Date().toISOString()
              });
            }
          }
        }

        // 2. Delete removed documents from Firestore
        const localIds = localList.map(item => item.id);
        for (const fsId of firestoreIds) {
          if (!localIds.includes(fsId)) {
            await deleteDoc(doc(db, "contactSubmissions", fsId));
          }
        }
      } catch (e) {
        console.error("Sync submissions to Firestore failed:", e);
      } finally {
        isSyncingSubmissions = false;
      }
    }

    // ----------------------------------------------------
    // 2. Admin Panel Realtime Sync (Contact Submissions)
    // ----------------------------------------------------
    function setupAdminSubmissionsSync() {
      if (!db) return;
      try {
        onSnapshot(collection(db, "contactSubmissions"),
          (snapshot) => {
            const list = [];
            snapshot.forEach(d => {
              list.push({ id: d.id, ...d.data() });
            });
            list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            isSyncingSubmissions = true;
            localStorage.setItem("db_contactSubmissions", JSON.stringify(list));
            isSyncingSubmissions = false;
          },
          (error) => {
            console.error("Admin submissions background sync error:", error);
          }
        );
      } catch (e) {
        console.error("setupAdminSubmissionsSync failed:", e);
      }
    }

    if (window.location.hash.includes("/admin") || window.location.href.includes("admin")) {
      setupAdminSubmissionsSync();
    }

    // ----------------------------------------------------
    // 3. Customer Floating Chatbot Controller
    // ----------------------------------------------------
    const trigger = document.getElementById("live-chat-trigger");
    const panel = document.getElementById("live-chat-panel");
    const closeBtn = document.getElementById("live-chat-close");
    const msgContainer = document.getElementById("chat-messages-container");
    const footerArea = document.getElementById("chat-footer-area");

    function checkChatbotVisibility() {
      if (window.location.hash.includes("/admin") || window.location.pathname.includes("/admin") || window.location.href.includes("admin")) {
        trigger.style.display = "none";
        panel.classList.remove("chat-visible");
        trigger.classList.remove("chat-open");
      } else {
        trigger.style.display = "flex";
      }
    }
    window.addEventListener("hashchange", checkChatbotVisibility);
    checkChatbotVisibility();

    trigger.addEventListener("click", () => {
      const isVisible = panel.classList.toggle("chat-visible");
      trigger.classList.toggle("chat-open", isVisible);
      if (isVisible) {
        initializeChatSession();
      }
    });

    closeBtn.addEventListener("click", () => {
      panel.classList.remove("chat-visible");
      trigger.classList.remove("chat-open");
    });

    let activeSessionId = localStorage.getItem("chat_session_id") || "";
    let customerName = localStorage.getItem("chat_customer_name") || "";
    let customerEmail = localStorage.getItem("chat_customer_email") || "";

    function initializeChatSession() {
      if (!activeSessionId) {
        renderOnboardingForm();
      } else {
        renderChatInterface();
        fetchChatMessagesFromServer(activeSessionId);
      }
    }

    function renderOnboardingForm() {
      msgContainer.innerHTML = `
          <div class="chat-onboarding">
            <p><strong>Hi! I'm Al-Amin's digital assistant.</strong> Please introduce yourself to start a conversation!</p>
            <div class="onboarding-input-group">
              <label>Your Name</label>
              <input type="text" id="ob-name" placeholder="Name" required>
            </div>
            <div class="onboarding-input-group">
              <label>Email Address</label>
              <input type="email" id="ob-email" placeholder="Email" required>
            </div>
            <button class="onboarding-submit-btn" id="ob-submit-btn">Start Conversation</button>
          </div>
        `;
      footerArea.innerHTML = "";

      document.getElementById("ob-submit-btn").addEventListener("click", async () => {
        const name = document.getElementById("ob-name").value.trim();
        const email = document.getElementById("ob-email").value.trim();

        if (!name || !email) {
          alert("Please fill in all fields.");
          return;
        }

        const sId = "session_" + Math.random().toString(36).substr(2, 9);
        activeSessionId = sId;
        customerName = name;
        customerEmail = email;

        localStorage.setItem("chat_session_id", sId);
        localStorage.setItem("chat_customer_name", name);
        localStorage.setItem("chat_customer_email", email);

        // Notify server
        try {
          await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'customer_message',
              sessionId: sId,
              customerName: name,
              customerEmail: email,
              message: "Hello! I started a conversation."
            })
          });
        } catch (e) {
          console.error("New chat notify error:", e);
        }

        initializeChatSession();
      });
    }

    function renderChatInterface() {
      msgContainer.innerHTML = `<div style="text-align: center; font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 10px;">Loading chat...</div>`;
      footerArea.innerHTML = `
          <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" required>
            <button type="submit" id="chat-send-btn">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </form>
        `;

      const form = document.getElementById("chat-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        appendMessageBubble(text, 'customer', new Date().toISOString());

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'customer_message',
              sessionId: activeSessionId,
              customerName: customerName || 'Visitor',
              customerEmail: customerEmail || '',
              message: text
            })
          });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) {
              localStorage.setItem("db_chatSessions", JSON.stringify(data));
            }
          }
        } catch (err) {
          console.error("Chat send error:", err);
        }
      });
    }

    function appendMessageBubble(text, sender, timestamp) {
      const timeStr = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
      const msgEl = document.createElement("div");
      msgEl.className = `chat-message ${sender}`;
      msgEl.innerHTML = `
          <div class="chat-bubble">${escapeHtml(text)}</div>
          <span class="chat-time">${timeStr}</span>
        `;
      msgContainer.appendChild(msgEl);
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    async function fetchChatMessagesFromServer(sId) {
      if (!sId) return;
      try {
        const res = await fetch('/api/chat?t=' + Date.now());
        if (res.ok) {
          const sessions = await res.json();
          if (Array.isArray(sessions)) {
            localStorage.setItem("db_chatSessions", JSON.stringify(sessions));
            const session = sessions.find(s => s.id === sId);
            renderSessionMessages(session);
          }
        }
      } catch (e) {
        const sessions = JSON.parse(localStorage.getItem("db_chatSessions") || "[]");
        const session = sessions.find(s => s.id === sId);
        renderSessionMessages(session);
      }
    }

    function renderSessionMessages(session) {
      msgContainer.innerHTML = "";

      // Welcome message
      const welcomeMsg = document.createElement("div");
      welcomeMsg.className = "chat-message admin";
      welcomeMsg.innerHTML = `
          <div class="chat-bubble">Hi! I'm Al-Amin Khan's assistant. How can I help you with tracking, GA4, CAPI or lead generation setup?</div>
        `;
      msgContainer.appendChild(welcomeMsg);

      if (session && session.messages) {
        session.messages.forEach(msg => {
          appendMessageBubble(msg.text, msg.sender, msg.timestamp);
        });
      }
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    // Realtime polling from server every 2 seconds
    setInterval(() => {
      if (activeSessionId && panel && panel.classList.contains("chat-visible")) {
        fetchChatMessagesFromServer(activeSessionId);
      }
    }, 2000);
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ----------------------------------------------------
    // 4. Admin Custom Tabs Injection & Controller
    // ----------------------------------------------------
    let activeAdminSessionId = "";
    let currentActiveCustomTab = "";

    // Correct selectors matching the compiled React admin panel
    const SIDEBAR_SELECTOR = "aside.w-64.bg-bg-card";
    const MAIN_PANEL_SELECTOR = "main.flex-1";

    function injectAdminTabs() {
      const sidebar = document.querySelector(SIDEBAR_SELECTOR);
      if (!sidebar) return;
      if (document.getElementById("admin-tab-live-chat")) return;

      const navContainer = sidebar.querySelector("nav") || sidebar.querySelector("div");
      if (!navContainer) return;

      // Separator
      const sep = document.createElement("div");
      sep.style.cssText = "border-top: 1px solid rgba(255,255,255,0.08); margin: 12px 0; padding-top: 4px;";
      sep.innerHTML = `<div style="font-size:9px; text-transform:uppercase; letter-spacing:0.15em; color:rgba(255,255,255,0.25); font-weight:800; padding: 0 16px; margin-bottom:4px;">Custom Modules</div>`;

      // 1. Live Chat Tab
      const chatTab = document.createElement("button");
      chatTab.id = "admin-tab-live-chat";
      chatTab.type = "button";
      chatTab.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-text-muted hover:bg-white/5 font-bold";
      chatTab.innerHTML = `
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span>Live Chat</span>
          <div id="admin-chat-unread-badge" style="display:none; width:8px; height:8px; border-radius:50%; background:#f45901; box-shadow: 0 0 10px #f45901; margin-left:auto;"></div>
        `;
      chatTab.addEventListener("click", () => activateAdminCustomTab("live_chat"));

      // 2. Contact Inquiries Tab
      const inquiriesTab = document.createElement("button");
      inquiriesTab.id = "admin-tab-contact-inquiries";
      inquiriesTab.type = "button";
      inquiriesTab.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-text-muted hover:bg-white/5 font-bold";
      inquiriesTab.innerHTML = `
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>Contact Inquiries</span>
        `;
      inquiriesTab.addEventListener("click", () => activateAdminCustomTab("contact_inquiries"));

      // 3. Clear Cache Tab
      const clearCacheTab = document.createElement("button");
      clearCacheTab.id = "admin-tab-clear-cache";
      clearCacheTab.type = "button";
      clearCacheTab.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-400 hover:bg-red-400/10 font-bold";
      clearCacheTab.innerHTML = `
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
          <span>Clear Cache</span>
        `;
      clearCacheTab.addEventListener("click", () => {
        if (confirm("Are you sure you want to clear the site cache? This will reload the page with fresh data.")) {
          localStorage.clear();
          sessionStorage.clear();
          window.location.reload(true);
        }
      });

      // Deactivate custom view when clicking existing React tabs
      const existingBtns = navContainer.querySelectorAll("button");
      existingBtns.forEach(t => {
        t.addEventListener("click", () => {
          if (t.id !== "admin-tab-live-chat" && t.id !== "admin-tab-contact-inquiries" && t.id !== "admin-tab-clear-cache") {
            deactivateAdminCustomTabs();
          }
        });
      });

      navContainer.appendChild(sep);
      navContainer.appendChild(chatTab);
      navContainer.appendChild(inquiriesTab);
      navContainer.appendChild(clearCacheTab);

    function activateAdminCustomTab(tabId) {
      currentActiveCustomTab = tabId;

      // Reset all custom tab styles
      const chatTab = document.getElementById("admin-tab-live-chat");
      const inquiriesTab = document.getElementById("admin-tab-contact-inquiries");
      if (chatTab) chatTab.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-text-muted hover:bg-white/5 font-bold";
      if (inquiriesTab) inquiriesTab.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-text-muted hover:bg-white/5 font-bold";

      // Highlight active tab
      const activeBtn = document.getElementById(tabId === "live_chat" ? "admin-tab-live-chat" : "admin-tab-contact-inquiries");
      if (activeBtn) {
        activeBtn.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-accent/10 text-white font-bold";
      }

      // Deactivate React's built-in nav buttons
      const sidebar = document.querySelector(SIDEBAR_SELECTOR);
      if (sidebar) {
        sidebar.querySelectorAll("nav button").forEach(btn => {
          if (!btn.id.startsWith("admin-tab-")) {
            btn.className = btn.className.replace(/bg-accent.*?text-white\s*font-bold/g, "text-text-muted hover:bg-white/5");
          }
        });
      }

      // Hide the React main panel, show our custom panel
      const mainPanel = document.querySelector(MAIN_PANEL_SELECTOR);
      if (mainPanel) {
        let customPanel = document.getElementById("admin-custom-viewport-panel");
        if (!customPanel) {
          customPanel = document.createElement("div");
          customPanel.id = "admin-custom-viewport-panel";
          customPanel.className = "flex-1 p-10 overflow-y-auto max-h-screen";
          customPanel.style.display = "block";
          mainPanel.parentNode.appendChild(customPanel);
        } else {
          customPanel.style.display = "block";
        }

        mainPanel.style.display = "none";

        if (tabId === "live_chat") {
          renderAdminChatManagerLayout();
        } else if (tabId === "contact_inquiries") {
          renderAdminInquiriesLayout();
        }
      }
    }

    function deactivateAdminCustomTabs() {
      currentActiveCustomTab = "";
      const chatTab = document.getElementById("admin-tab-live-chat");
      const inquiriesTab = document.getElementById("admin-tab-contact-inquiries");
      if (chatTab) chatTab.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-text-muted hover:bg-white/5 font-bold";
      if (inquiriesTab) inquiriesTab.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-text-muted hover:bg-white/5 font-bold";

      const mainPanel = document.querySelector(MAIN_PANEL_SELECTOR);
      const customPanel = document.getElementById("admin-custom-viewport-panel");

      if (mainPanel) mainPanel.style.display = "block";
      if (customPanel) customPanel.style.display = "none";
    }

    // ----------------------------------------------------
    // 4.2 Live Chat Manager (localStorage-based)
    // ----------------------------------------------------
    function getChatSessions() {
      try {
        return JSON.parse(localStorage.getItem("db_chatSessions") || "[]");
      } catch (e) { return []; }
    }
    function saveChatSessions(sessions) {
      localStorage.setItem("db_chatSessions", JSON.stringify(sessions));
    }

    function renderAdminChatManagerLayout() {
      const container = document.getElementById("admin-custom-viewport-panel");
      if (!container) return;

      container.innerHTML = `
          <div class="mb-8">
            <h1 class="text-3xl font-black text-white">Live Conversations</h1>
            <p class="text-gray-400 text-sm mt-1">Manage visitor chat messages. Reply to customers in real-time from this module.</p>
          </div>
          <div class="admin-livechat-container">
            <div class="admin-livechat-list-pane">
              <div class="admin-livechat-pane-header">
                <h2>Active Inquiries</h2>
                <p>Visitor Chats</p>
              </div>
              <div class="admin-livechat-list" id="admin-chat-threads-list">
                <div style="text-align:center; padding:40px 20px; font-size:13px; color:rgba(255,255,255,0.3);">Loading chat threads...</div>
              </div>
            </div>
            <div class="admin-livechat-chat-pane" id="admin-chat-viewport">
              <div class="admin-livechat-empty-state">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>Select a conversation to reply</span>
              </div>
            </div>
          </div>
        `;

      renderAdminChatThreads();
    }

    function renderAdminChatThreads() {
      const listContainer = document.getElementById("admin-chat-threads-list");
      if (!listContainer) return;

      const sessions = getChatSessions();

      if (sessions.length === 0) {
        listContainer.innerHTML = `<div style="text-align:center; padding:40px 20px; font-size:13px; color:rgba(255,255,255,0.3);">No active chat sessions.<br><span style="font-size:11px; margin-top:8px; display:inline-block;">When visitors use the chat widget on your site, their messages will appear here.</span></div>`;
        return;
      }

      listContainer.innerHTML = "";
      sessions.forEach(chat => {
        const item = document.createElement("div");
        item.className = `admin-livechat-item ${chat.id === activeAdminSessionId ? "active" : ""}`;

        const timeStr = chat.updatedAt ? new Date(chat.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";

        item.innerHTML = `
            <div class="admin-livechat-item-header">
              <span class="admin-livechat-item-name">${escapeHtml(chat.customerName || "Anonymous Visitor")}</span>
              <span class="admin-livechat-item-time">${timeStr}</span>
            </div>
            <div class="admin-livechat-item-bottom">
              <span class="admin-livechat-item-preview">${escapeHtml(chat.lastMessage || "")}</span>
              ${chat.unreadByAdmin ? '<div class="admin-livechat-item-badge"></div>' : ''}
            </div>
          `;

        item.addEventListener("click", () => {
          activeAdminSessionId = chat.id;
          document.querySelectorAll(".admin-livechat-item").forEach(el => el.classList.remove("active"));
          item.classList.add("active");
          openAdminChatThread(chat);
        });

        listContainer.appendChild(item);
      });
    }

    function openAdminChatThread(chat) {
      const viewport = document.getElementById("admin-chat-viewport");
      if (!viewport) return;

      // Mark as read
      const sessions = getChatSessions();
      const sessionIdx = sessions.findIndex(s => s.id === chat.id);
      if (sessionIdx !== -1) {
        sessions[sessionIdx].unreadByAdmin = false;
        saveChatSessions(sessions);
      }

      viewport.innerHTML = `
          <div class="admin-livechat-chat-header">
            <div class="admin-livechat-chat-header-user">
              <h3>${escapeHtml(chat.customerName || "Anonymous Visitor")}</h3>
              <p>${escapeHtml(chat.customerEmail || "No email")} • Session: ${chat.id}</p>
            </div>
            <button class="admin-livechat-delete-btn" id="admin-chat-delete">Delete Thread</button>
          </div>
          <div class="admin-livechat-messages" id="admin-messages-list"></div>
          <div class="admin-livechat-reply-pane">
            <div class="admin-livechat-templates">
              <span class="admin-livechat-template-chip" data-text="Hi! How can I help you today?">Greeting</span>
              <span class="admin-livechat-template-chip" data-text="Yes, I specialize in server-side GA4 / GTM configurations and custom Conversion API (CAPI) setups.">GTM Setup</span>
              <span class="admin-livechat-template-chip" data-text="Let's schedule a brief Zoom discovery call. What is your time zone?">Zoom Call</span>
              <span class="admin-livechat-template-chip" data-text="Thanks for reaching out! I will review your inquiry and email you back soon.">Email Back</span>
            </div>
            <form id="admin-reply-form" class="admin-livechat-reply-box">
              <textarea class="admin-livechat-reply-textarea" id="admin-reply-input" placeholder="Type a message... Press Enter to send" required></textarea>
              <button type="submit" class="admin-livechat-send-btn">Send Reply</button>
            </form>
          </div>
        `;

      // Load messages from localStorage
      const msgsList = document.getElementById("admin-messages-list");
      const messages = chat.messages || [];

      msgsList.innerHTML = "";
      if (messages.length === 0) {
        msgsList.innerHTML = `<div style="text-align:center; padding:40px; font-size:13px; color:rgba(255,255,255,0.2);">No messages in this thread yet.</div>`;
      } else {
        messages.forEach(msg => {
          const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
          const msgEl = document.createElement("div");
          msgEl.className = `chat-message ${msg.sender}`;
          msgEl.innerHTML = `
              <div class="chat-bubble">${escapeHtml(msg.text)}</div>
              <span class="chat-time">${timeStr}</span>
            `;
          msgsList.appendChild(msgEl);
        });
        msgsList.scrollTop = msgsList.scrollHeight;
      }

      // Template chips
      document.querySelectorAll(".admin-livechat-template-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          const input = document.getElementById("admin-reply-input");
          input.value = chip.getAttribute("data-text");
          input.focus();
        });
      });

      // Delete thread
      document.getElementById("admin-chat-delete").addEventListener("click", () => {
        if (confirm("Delete this conversation permanently?")) {
          let allSessions = getChatSessions();
          allSessions = allSessions.filter(s => s.id !== chat.id);
          saveChatSessions(allSessions);
          activeAdminSessionId = "";
          renderAdminChatManagerLayout();
        }
      });

      // Send reply
      const replyForm = document.getElementById("admin-reply-form");
      replyForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("admin-reply-input");
        const text = input.value.trim();
        if (!text) return;

        input.value = "";

        const allSessions = getChatSessions();
        const idx = allSessions.findIndex(s => s.id === chat.id);
        if (idx !== -1) {
          if (!allSessions[idx].messages) allSessions[idx].messages = [];
          allSessions[idx].messages.push({
            text: text,
            sender: "admin",
            timestamp: new Date().toISOString()
          });
          allSessions[idx].lastMessage = text;
          allSessions[idx].updatedAt = new Date().toISOString();
          allSessions[idx].unreadByAdmin = false;
          saveChatSessions(allSessions);

          // Re-render messages
          openAdminChatThread(allSessions[idx]);
        }
      });

      // Enter to send
      const replyInput = document.getElementById("admin-reply-input");
      replyInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          replyForm.dispatchEvent(new Event("submit"));
        }
      });
    }

    // ----------------------------------------------------

          </div>
          <div class="admin-livechat-container" style="flex-direction: column; height: auto; min-height: unset; padding: 24px; background: rgba(11, 15, 25, 0.4);">
            <div style="overflow-x: auto; width: 100%;">
              <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">

                  <tr style="border-bottom: 2px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); font-weight: 700;">

                    <th style="padding: 12px 16px;">Visitor</th>

                    <th style="padding: 12px 16px; text-align: right;">Actions</th>

                </thead>
                <tbody id="admin-inquiries-table-body">
                  <tr>
                    <td colspan="5" style="text-align: center; padding: 32px; color: rgba(255,255,255,0.3);">Loading inquiries...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        `;

      loadAdminInquiriesFromLocalStorage();
    }

    function loadAdminInquiriesFromLocalStorage() {
      const tbody = document.getElementById("admin-inquiries-table-body");
      if (!tbody) return;

      let submissions = [];
      try {
        const raw = localStorage.getItem("db_contactSubmissions");
        submissions = raw ? JSON.parse(raw) : [];
      } catch (e) {
        submissions = [];
      }

      if (!submissions || submissions.length === 0) {
        tbody.innerHTML = `
            <tr>
              <td colspan="5" style="text-align: center; padding: 32px; color: rgba(255,255,255,0.3);">No form submissions found yet.</td>
            </tr>
          `;
        return;
      }

      // Sort newest first
      submissions.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

      tbody.innerHTML = "";
      submissions.forEach((data, idx) => {
        const dateStr = data.createdAt ? new Date(data.createdAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : "N/A";

        const tr = document.createElement("tr");
        tr.style.borderBottom = "1px solid rgba(255,255,255,0.05)";
        tr.innerHTML = `
            <td style="padding: 16px; color: rgba(255,255,255,0.7); font-size: 13px; white-space: nowrap;">${dateStr}</td>
            <td style="padding: 16px;">
              <div style="font-weight: 700; color: white;">${escapeHtml(data.name || '')}</div>
              <div style="font-size: 12px; color: rgba(255,255,255,0.4);">${escapeHtml(data.email || '')}</div>
            </td>
            <td style="padding: 16px; color: rgba(255,255,255,0.9); font-weight: 600;">${escapeHtml(data.subject || 'No Subject')}</td>
            <td style="padding: 16px; color: rgba(255,255,255,0.6); max-width: 300px; word-break: break-word;">${escapeHtml(data.message || '')}</td>
            <td style="padding: 16px; text-align: right; white-space: nowrap;">
              <button class="inquiry-reply-btn" style="padding: 6px 12px; border-radius: 6px; background: rgba(244, 89, 1, 0.1); border: 1px solid rgba(244, 89, 1, 0.2); color: white; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; margin-right: 8px;">Reply</button>
              <button class="inquiry-delete-btn" style="padding: 6px 12px; border-radius: 6px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: rgb(248, 113, 113); font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;">Delete</button>
            </td>
          `;

        tr.querySelector(".inquiry-reply-btn").addEventListener("click", () => {
          window.open(`mailto:${data.email}?subject=Re: ${encodeURIComponent(data.subject || '')}`);
        });

        tr.querySelector(".inquiry-delete-btn").addEventListener("click", () => {
          if (confirm(`Are you sure you want to delete the submission from ${data.name}?`)) {
            let all = JSON.parse(localStorage.getItem("db_contactSubmissions") || "[]");
            all.splice(idx, 1);
            localStorage.setItem("db_contactSubmissions", JSON.stringify(all));
            // Sync to db.json
            if (typeof syncDatabaseToServer === "function") syncDatabaseToServer();
            loadAdminInquiriesFromLocalStorage();
          }
        });

        tbody.appendChild(tr);
      });
    }

    const checkAdminSidebarInterval = setInterval(() => {
      checkChatbotVisibility();
      if (window.location.hash.includes("/admin") || window.location.href.includes("admin")) {
        injectAdminTabs();
      } else {
        deactivateAdminCustomTabs();
      }
    }, 1000);

    // ----------------------------------------------------
    // 5. Admin Upload Button Injection
    // ----------------------------------------------------
    function injectAdminUploadButtons() {
      if (!window.location.hash.includes("/admin") && !window.location.href.includes("admin")) return;

      const inputs = document.querySelectorAll('input[type="text"], textarea');
      inputs.forEach(input => {
        if (input.hasAttribute('data-upload-injected')) return;

        const parent = input.parentElement;
        const label = parent ? parent.querySelector('label') : null;
        const labelText = label ? label.textContent.toLowerCase() : "";
        const placeholder = input.placeholder ? input.placeholder.toLowerCase() : "";
        const id = input.id ? input.id.toLowerCase() : "";
        const name = input.name ? input.name.toLowerCase() : "";

        const isFileField = /image|thumbnail|photo|logo|video|url|bg|avatar|icon|file/i.test(labelText + ' ' + placeholder + ' ' + id + ' ' + name);

        if (isFileField) {
          input.setAttribute('data-upload-injected', 'true');

          const btnContainer = document.createElement('div');
          btnContainer.className = "mt-1.5 flex items-center justify-end";

          const uploadBtn = document.createElement('button');
          uploadBtn.type = "button";
          uploadBtn.className = "px-3 py-1 bg-white/5 border border-white/10 hover:border-[#f45901]/40 hover:bg-[#f45901]/10 text-white text-xs font-bold rounded-lg transition-all flex items-center gap-1.5 cursor-pointer";
          uploadBtn.innerHTML = `
              <svg class="w-3.5 h-3.5 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              <span>Upload File</span>
            `;

          uploadBtn.addEventListener("click", () => {
            const fileInput = document.createElement('input');
            fileInput.type = "file";
            fileInput.accept = "image/*,video/*,application/pdf";

            fileInput.onchange = async () => {
              const file = fileInput.files[0];
              if (!file) return;

              uploadBtn.disabled = true;
              uploadBtn.querySelector('span').textContent = 'Uploading...';

              // Try local upload first
              let uploadSuccess = false;
              try {
                const response = await fetch('/api/upload', {
                  method: 'POST',
                  headers: {
                    'X-File-Name': file.name,
                    'Content-Type': file.type
                  },
                  body: file
                });

                if (response.ok) {
                  const result = await response.json();

                  const nativeSetter = Object.getOwnPropertyDescriptor(
                    input.tagName === 'TEXTAREA' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype,
                    "value"
                  ).set;
                  nativeSetter.call(input, result.url);
                  input.dispatchEvent(new Event('input', { bubbles: true }));

                  uploadBtn.querySelector('span').textContent = 'Uploaded!';
                  uploadSuccess = true;
                }
              } catch (err) {
                console.warn("Local upload failed, falling back to Firebase...", err);
              }

              if (!uploadSuccess) {
                if (!db) {
                  alert("Upload failed: Offline / Database Connection unavailable");
                  uploadBtn.querySelector('span').textContent = 'Upload File';
                  uploadBtn.disabled = false;
                  return;
                }
                // Fallback to Firebase Storage
                try {
                  const { getStorage, ref, uploadBytes, getDownloadURL } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js");
                  const storage = getStorage(app);
                  const storageRef = ref(storage, 'uploads/' + Date.now() + '_' + file.name);

                  await uploadBytes(storageRef, file);
                  const url = await getDownloadURL(storageRef);

                  const nativeSetter = Object.getOwnPropertyDescriptor(
                    input.tagName === 'TEXTAREA' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype,
                    "value"
                  ).set;
                  nativeSetter.call(input, url);
                  input.dispatchEvent(new Event('input', { bubbles: true }));

                  uploadBtn.querySelector('span').textContent = 'Uploaded!';
                  uploadSuccess = true;
                } catch (firebaseErr) {
                  console.error("Firebase upload failed:", firebaseErr);
                  alert("Upload failed: " + firebaseErr.message);
                }
              }

              setTimeout(() => {
                uploadBtn.querySelector('span').textContent = 'Upload File';
                uploadBtn.disabled = false;
              }, 2000);
            };

            fileInput.click();
          });

          btnContainer.appendChild(uploadBtn);
          input.parentNode.insertBefore(btnContainer, input.nextSibling);
        }
      });
    }

    // Scan every 1 second for new input fields
    setInterval(injectAdminUploadButtons, 1000);

  </script>
</body>

</html>
