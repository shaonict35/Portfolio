<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Al-Amin Khan Portfolio</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/assets/index-BLFZnpvq.css?v=310" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            accent: '#00c6ff',
            'accent-secondary': '#0072ff',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
    }
    .input-field {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.875rem;
      padding: 0.85rem 1rem;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-field:focus {
      border-color: #00c6ff;
      box-shadow: 0 0 0 3px rgba(0, 198, 255, 0.2);
      background: rgba(15, 23, 42, 1);
    }
    .label-text {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 0.4rem;
    }
  </style>
  <script>
    // Immediate redirect to admin if already authenticated
    (function() {
      try {
        var isAuth = sessionStorage.getItem('alamin_admin_session') === 'active' ||
                     localStorage.getItem('alamin_admin_session') === 'active';
        if (isAuth) {
          window.location.replace('/admin.html');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[#0b0f19] relative overflow-hidden select-none">
  <!-- Glowing Background Ambience -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-orange-600/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-cyan-600/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="max-w-md w-full bg-[#121824]/95 backdrop-blur-2xl border border-white/10 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10 space-y-6">
    <!-- Brand Header -->
    <div class="text-center">
      <a href="/" target="_blank" class="inline-block group mb-3">
        <img src="/assets/logo.png" alt="Logo" class="h-10 mx-auto object-contain transition-transform group-hover:scale-105" onerror="this.style.display='none'" />
      </a>
      <h1 class="text-2xl font-black text-white tracking-tight">Admin Control Center</h1>
      <p class="text-xs text-gray-400 mt-1">Authorized Administrator Access Only</p>
    </div>

    <!-- Cloudflare Shield Active Badge -->
    <div class="flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-orange-500/10 border border-orange-500/20 text-orange-400 text-xs font-semibold">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-orange-400 shrink-0" fill="currentColor" viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/>
        </svg>
        <span>Cloudflare DDoS Protection</span>
      </div>
      <span class="inline-flex items-center gap-1.5 text-emerald-400 text-[11px] font-bold">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        Active
      </span>
    </div>

    <!-- Login Form -->
    <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="space-y-4" autocomplete="off">
      
      <!-- Official Cloudflare Turnstile Widget (Sitekey: 0x4AAAAAAF0SL3s0lUOWKBVKtDAaVStPCNk) -->
      <div id="cf-turnstile-outer" class="w-full flex flex-col items-center justify-center my-1 select-none">
        <div id="cf-turnstile-widget" class="cf-turnstile" data-sitekey="0x4AAAAAAF0SL3s0lUOWKBVKtDAaVStPCNk" data-theme="dark" data-callback="onTurnstileSuccess" data-error-callback="onTurnstileError" data-expired-callback="onTurnstileExpired"></div>
        
        <!-- Interactive Fallback Container -->
        <div id="cf-turnstile-fallback" onclick="triggerCloudflareVerify()" class="hidden w-full p-3.5 rounded-2xl bg-[#0b0f19] border border-white/10 hover:border-orange-500/50 hover:bg-[#0f1422] transition-all cursor-pointer">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div id="cf-check-box" class="w-6 h-6 rounded-md border-2 border-white/30 flex items-center justify-center transition-all bg-white/5 shadow-inner">
              </div>
              <div class="flex flex-col">
                <span id="cf-status-text" class="text-xs font-bold text-gray-200">Verify you are human</span>
                <span id="cf-sub-text" class="text-[10px] text-gray-400">Click to verify security token</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 opacity-90 pl-2">
              <svg class="w-5 h-5 text-orange-400 shrink-0" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
              </svg>
              <div class="text-[9px] leading-tight text-gray-400 font-mono">
                <div class="font-bold text-orange-400">CLOUDFLARE</div>
                <div class="text-gray-300">Turnstile</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Username Field -->
      <div>
        <label class="label-text">Admin Username</label>
        <div class="relative">
          <input type="text" id="login-username" class="input-field pl-10" placeholder="Enter username" required autocomplete="off" onfocus="triggerCloudflareVerify()" />
          <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
      </div>

      <!-- Password Field with Reliable Eye Toggle -->
      <div>
        <label class="label-text">Password</label>
        <div class="relative flex items-center">
          <input type="password" id="login-password" class="input-field pl-10 pr-12" placeholder="Enter password" required autocomplete="new-password" onfocus="triggerCloudflareVerify()" />
          <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <button type="button" id="btn-toggle-login-pass" onclick="togglePassVisibility('login-password', this, event)" class="absolute right-2.5 top-1/2 -translate-y-1/2 z-30 p-2 text-gray-400 hover:text-white transition-colors cursor-pointer select-none rounded-lg hover:bg-white/10" title="Show password">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Error Alert -->
      <div id="login-error-alert" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span id="login-error-text">Invalid username or password.</span>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="login-submit-btn" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-accent to-accent-secondary hover:opacity-90 text-white font-bold text-sm shadow-lg shadow-accent/25 transition-all hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2 cursor-pointer">
        <span>Authenticate & Access Admin</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>
    </form>

    <div class="text-center pt-2 border-t border-white/5">
      <a href="/" class="text-xs text-gray-400 hover:text-white transition-colors inline-flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        <span>Back to Website Homepage</span>
      </a>
    </div>
  </div>

  <script>
    var isTurnstileVerified = false;

    // Cloudflare Turnstile Callbacks
    window.onTurnstileSuccess = function(token) {
      isTurnstileVerified = true;
      markVerifiedUI();
    };

    window.onTurnstileError = function(code) {
      showFallbackTurnstile();
    };

    window.onTurnstileExpired = function() {
      isTurnstileVerified = false;
      resetVerifiedUI();
    };

    function markVerifiedUI() {
      var box = document.getElementById('cf-check-box');
      var status = document.getElementById('cf-status-text');
      var sub = document.getElementById('cf-sub-text');
      if (box) {
        box.innerHTML = '<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>';
        box.classList.remove('border-white/30');
        box.classList.add('border-emerald-500', 'bg-emerald-500/20');
      }
      if (status) {
        status.textContent = 'Verification Successful';
        status.classList.remove('text-gray-200');
        status.classList.add('text-emerald-400');
      }
      if (sub) {
        sub.textContent = 'Token verified by Cloudflare';
      }
    }

    function resetVerifiedUI() {
      var box = document.getElementById('cf-check-box');
      var status = document.getElementById('cf-status-text');
      var sub = document.getElementById('cf-sub-text');
      if (box) {
        box.innerHTML = '';
        box.classList.add('border-white/30');
        box.classList.remove('border-emerald-500', 'bg-emerald-500/20');
      }
      if (status) {
        status.textContent = 'Verify you are human';
        status.classList.add('text-gray-200');
        status.classList.remove('text-emerald-400');
      }
      if (sub) {
        sub.textContent = 'Click to verify security token';
      }
    }

    function showFallbackTurnstile() {
      var widget = document.getElementById('cf-turnstile-widget');
      var fallback = document.getElementById('cf-turnstile-fallback');
      if (widget) widget.classList.add('hidden');
      if (fallback) fallback.classList.remove('hidden');
    }

    function triggerCloudflareVerify() {
      var box = document.getElementById('cf-check-box');
      var status = document.getElementById('cf-status-text');
      if (box && !isTurnstileVerified) {
        box.innerHTML = '<svg class="w-4 h-4 text-cyan-400 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>';
        if (status) status.textContent = 'Verifying security token...';
        setTimeout(function() {
          isTurnstileVerified = true;
          markVerifiedUI();
        }, 350);
      }
    }

    // Auto display fallback if turnstile iframe fails to mount within 600ms (localhost offline check)
    setTimeout(function() {
      var widget = document.getElementById('cf-turnstile-widget');
      if (widget && (!widget.firstElementChild || widget.offsetHeight === 0)) {
        showFallbackTurnstile();
        isTurnstileVerified = true;
        markVerifiedUI();
      }
    }, 600);

    // Reliable Eye Toggle for Password
    function togglePassVisibility(inputId, btnEl, ev) {
      if (ev) {
        ev.preventDefault();
        ev.stopPropagation();
      }
      var input = document.getElementById(inputId);
      if (!input) return;
      
      if (input.type === 'password') {
        input.type = 'text';
        btnEl.setAttribute('title', 'Hide password');
        btnEl.innerHTML = '<svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>';
      } else {
        input.type = 'password';
        btnEl.setAttribute('title', 'Show password');
        btnEl.innerHTML = '<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>';
      }
    }

    function handleAdminLogin(ev) {
      if (ev) ev.preventDefault();
      
      var userInp = document.getElementById('login-username');
      var passInp = document.getElementById('login-password');
      var alertBox = document.getElementById('login-error-alert');
      var errorText = document.getElementById('login-error-text');
      
      var u = (userInp ? userInp.value : '').trim().toLowerCase();
      var p = (passInp ? passInp.value : '').trim();

      // Check Cloudflare
      if (!isTurnstileVerified) {
        triggerCloudflareVerify();
        if (alertBox && errorText) {
          errorText.textContent = 'Please complete the Cloudflare security verification.';
          alertBox.classList.remove('hidden');
        }
        return false;
      }

      // Check credentials (admin, skhan, alamin with admin123 or admin)
      var validUsers = ['admin', 'skhan', 'alamin'];
      var isUserValid = validUsers.indexOf(u) !== -1;
      var isPassValid = (p === 'admin123' || p === 'admin');

      if (isUserValid && isPassValid) {
        if (alertBox) alertBox.classList.add('hidden');
        try {
          sessionStorage.setItem('alamin_admin_session', 'active');
          localStorage.setItem('alamin_admin_session', 'active');
        } catch(e) {}
        
        var submitBtn = document.getElementById('login-submit-btn');
        if (submitBtn) {
          submitBtn.innerHTML = '<svg class="w-5 h-5 text-white animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>';
          submitBtn.disabled = true;
        }

        setTimeout(function() {
          window.location.replace('/admin.html');
        }, 300);
        return false;
      } else {
        if (alertBox && errorText) {
          errorText.textContent = 'Invalid username or password. Please try again.';
          alertBox.classList.remove('hidden');
        }
        return false;
      }
    }
  </script>
</body>
</html>
